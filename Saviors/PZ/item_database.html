<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Zero Database</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #111;
            color: #fff;
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        input {

            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-bottom: 25px;

        }

        #grid {

            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));

            gap: 20px;

        }

        .card {

            background: #222;

            border: 1px solid #444;

            border-radius: 10px;

            padding: 15px;

            text-align: center;

            transition: .2s;

            cursor: pointer;

        }

        .card:hover {

            border-color: orange;

            transform: translateY(-4px);

        }

        .card img {

            width: 100%;

            height: 150px;

            object-fit: contain;

            margin-bottom: 10px;

        }

        .card h3 {

            font-size: 18px;

            margin-bottom: 5px;

        }

        .card p {

            font-size: 13px;

            color: #aaa;

        }

        .popup {

            display: none;

            position: fixed;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background: rgba(0, 0, 0, .8);

            justify-content: center;

            align-items: center;

            z-index: 999;

        }

        .popupBox {

            width: 800px;

            max-width: 90%;

            background: #222;

            padding: 30px;

            border-radius: 10px;

            border: 2px solid orange;

            max-height: 90vh;

            overflow: auto;

        }

        .close {

            float: right;

            font-size: 25px;

            cursor: pointer;

            color: white;

        }

        .popupBox img {

            width: 180px;

            display: block;

            margin: auto;

            margin-bottom: 20px;

        }
    </style>

</head>

<body>

    <div id="popup" class="popup">

        <div class="popupBox">

            <span class="close" onclick="closePopup()">✖</span>

            <div id="popupContent"></div>

        </div>

    </div>

    <h1>Project Zero Database</h1>

    <input id="search" placeholder="Search Item...">

    <div id="grid"></div>

    <script>

        let ITEMS = [];

        fetch("project_zero.json")

            .then(res => res.json())

            .then(data => {

                const itemTable = data.find(t => t.type === "table" && t.name === "items");

                ITEMS = itemTable.data;

                render(ITEMS);

            });

        function render(list) {

            const grid = document.getElementById("grid");

            grid.innerHTML = "";

            list.forEach(item => {

                grid.innerHTML += `

<div class="card" onclick="showItem(${item.id})">

<img src="images/${item.image}"
onerror="this.src='images/no-image.png'">

<h3>${item.name}</h3>

<p>${item.category}</p>

</div>

`;

            });

        }

        document.getElementById("search")

            .addEventListener("input", function () {

                const keyword = this.value.toLowerCase();

                const result = ITEMS.filter(i =>

                    i.name.toLowerCase().includes(keyword)

                    ||

                    (i.category ?? "").toLowerCase().includes(keyword)

                );

                render(result);

            });
        function showItem(id) {

            const item = ITEMS.find(i => i.id == id);

            document.getElementById("popup").style.display = "flex";

            document.getElementById("popupContent").innerHTML = `

<img src="images/${item.image}"
onerror="this.src='images/no-image.png'">

<h2>${item.name}</h2>

<p><b>Category :</b> ${item.category ?? "-"}</p>

<p><b>Sub Category :</b> ${item.sub_category ?? "-"}</p>

<p><b>Inventory :</b> ${item.inventory_size ?? "-"}</p>

<p><b>Stackable :</b> ${item.stackable}</p>

`;

        }

        function closePopup() {

            document.getElementById("popup").style.display = "none";

        }
    </script>

</body>

</html>
